[package]
name = "hashrail"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Offline artifact manifests and static repository hygiene checks"

[[bin]]
name = "hashrail"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
